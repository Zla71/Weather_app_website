<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <a href="#" class="logo" id="logo">Weather Forecast</a>
        <form id="headerSearchForm" class="header-search" autocomplete="off" onsubmit="return false;">
            <input type="text" id="cityInput" placeholder="Enter city">
            <button id="searchBtn" type="button">Search</button>
        </form>
    </header>
    <main id="mainContent">
        <section id="homeSection">
            <h2 class="subtitle" id="capitalsSubtitle">Weather in some of the largest cities</h2>
            <div id="capitalsWeather" class="capitals-grid"></div>
        </section>
        <section id="searchSection" style="display:none;">
            <div class="container">
                <div id="weatherResult"></div>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
