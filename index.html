<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноза за времето</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <a href="#" class="logo" id="logo">Прогноза за времето</a>
        <div class="lang-switcher" style="display:flex;align-items:center;gap:8px;margin-right:16px;">
            <button id="langBg" title="Български" style="background:none;border:none;cursor:pointer;font-size:1.6em;">🇧🇬</button>
            <button id="langEn" title="English" style="background:none;border:none;cursor:pointer;font-size:1.6em;">🇬🇧</button>
            <button id="langEs" title="Español" style="background:none;border:none;cursor:pointer;font-size:1.6em;">🇪🇸</button>
        </div>
        <form id="headerSearchForm" class="header-search" autocomplete="off" onsubmit="return false;">
            <input type="text" id="cityInput" placeholder="Въведи град">
            <button id="searchBtn" type="button">Търси</button>
        </form>
    </header>
    <main id="mainContent">
        <section id="homeSection">
            <h2 class="subtitle">Времето в най-големите европейски столици</h2>
            <div id="capitalsWeather" class="capitals-grid"></div>
        </section>
        <section id="searchSection" style="display:none;">
            <div class="container">
                <div id="weatherResult"></div>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
